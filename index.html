<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimoire du Pôle Nord</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;800&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: veillée de Noël, conte et jeu de cartes à collectionner
   IDEA: un grimoire relié cuir qui se remplit de cartes holographiques
   PICTURE: livre fermé qui s'ouvre, cartes sur la table, Pokédex à feuilleter
   COLOUR and TYPE: nuit bleu profond, rouge cuir, or ; Cinzel Decorative + Crimson Pro
   LAYOUT: plein écran tactile, barre fine en haut, contenu centré */
:root{color-scheme:dark;--night:#0b1a2e;--gold:#e8c26a;--parch:#f4e7c8;--ink2:#3b2412}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#24497d 0%,var(--night) 55%,#050b16 100%);color:#f3ead5;font:16px/1.5 'Crimson Pro',Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#snow{position:fixed;inset:0;pointer-events:none;z-index:50}
.garland{position:fixed;top:58px;left:0;width:100%;height:70px;z-index:30;pointer-events:none;transition:opacity .6s}
.garland circle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(3vw,12px);z-index:40;background:linear-gradient(#050b16ee,#050b1600);transition:opacity .6s}
body.intro header,body.intro .garland{opacity:0;pointer-events:none}
.brand{font:700 clamp(16px,2.1vw,26px)/1.1 'Cinzel Decorative',serif;color:var(--gold);margin-right:auto}
.seg{display:flex;border:1px solid #e8c26a77;border-radius:999px;overflow:hidden}
.seg button,.btn{font:600 14px 'Cinzel',serif;color:#f3ead5;background:#0b1a2eaa;border:0;padding:0 16px;min-height:44px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:#2a1a05}
.btn{border:1px solid #e8c26a77;border-radius:999px}
.btn.gold{background:#9e1b22;border-color:var(--gold)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.net{font:13px 'Crimson Pro',serif;white-space:nowrap}.net.ok{color:#8fe3a0}.net.ko{color:#ff9b9b}
.count{font:600 14px 'Cinzel',serif;color:var(--gold);white-space:nowrap}
.view{position:fixed;inset:0;display:none}.view.on{display:block}
.foot{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-style:italic;color:#f3dcaacc;font-size:15px;pointer-events:none;padding:0 12px}
.note{position:fixed;left:12px;bottom:10px;font-size:13px;color:#f3dcaa88;z-index:41;margin:0;max-width:46vw}
@media(max-width:700px){.note{display:none}}

.card{--cw:220px;position:absolute;left:0;top:0;width:var(--cw);aspect-ratio:5/7;font-size:calc(var(--cw)/22);perspective:calc(var(--cw)*4);touch-action:none;cursor:grab;--mx:50%;--my:50%;--rx:0deg;--ry:0deg}
.card.held{cursor:grabbing}
.tilt,.flipper{position:absolute;inset:0;transform-style:preserve-3d}
.tilt{transform:rotateX(var(--rx)) rotateY(var(--ry))}
.flipper{transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.card.flip .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:4.5%/3.2%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1.2em 2.4em #000a}
.card.held .face{box-shadow:0 2.4em 4em #000c}
.el-givre{--c1:#eef7ff;--c2:#8fc3ee;--c3:#2f6fae;--ink:#0d2b4d;--s1:#cfe9ff;--s2:#4f8fd0}
.el-etoile{--c1:#fff6d6;--c2:#f2c64e;--c3:#a7741a;--ink:#4a3000;--s1:#5c56b8;--s2:#1f2363}
.el-sapin{--c1:#eaf7e4;--c2:#7cc46c;--c3:#2f7a34;--ink:#0f3312;--s1:#7fd17a;--s2:#1f4f24}
.el-braise{--c1:#ffe6d8;--c2:#ee8150;--c3:#9e2a12;--ink:#4a1203;--s1:#c2501f;--s2:#3a1408}
.front{background:linear-gradient(160deg,var(--c1),var(--c2));padding:.55em;color:var(--ink)}
.r-legend .front{background:linear-gradient(135deg,#fff1b8,#d9a032 30%,#fff1b8 50%,#b97f17 75%,#fff1b8)}
.frame{height:100%;border-radius:3%/2%;background:linear-gradient(#fff8,#fff0 35%),var(--c1);border:.18em solid var(--c3);display:flex;flex-direction:column;padding:.45em .55em;gap:.32em}
.top{display:flex;justify-content:space-between;align-items:center;gap:.3em}
.nm{font:800 1.08em/1.05 'Cinzel',serif}
.pv{font:600 .72em 'Cinzel',serif;display:flex;align-items:center;gap:.3em;white-space:nowrap}.pv b{font-size:1.6em}
.ico{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--c3);box-shadow:inset 0 -.15em 0 #0003}.ico svg{width:65%;height:65%}
.ico.sm{width:1.6em;height:1.6em}
.art{position:relative;height:44%;flex:none;border:.22em solid;border-color:#fffb var(--c3) var(--c3) #fffb;background:radial-gradient(ellipse at 50% 30%,var(--s1),var(--s2));overflow:hidden}
.art svg,.art img,.fart img,.sil img{width:100%;height:100%;display:block;object-fit:cover}
.sil.ph{filter:blur(6px) grayscale(1);opacity:.3;border-radius:6px;overflow:hidden}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(.9,1.1)}}
.typ{background:var(--c3);color:#fff;font:italic .68em/1.3 'Crimson Pro',serif;padding:.15em .5em;text-align:center;border-radius:.3em}
.atk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.45em;align-items:center;font-size:.82em;line-height:1.15;padding-bottom:.25em;border-bottom:1px solid #0002}
.atk b{display:block;font:600 .95em 'Cinzel',serif}.atk small{display:block;font-size:.8em;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.dmg{font:800 1.35em 'Cinzel',serif}
.desc{flex:1;display:flex;align-items:center;font:italic .72em/1.25 'Crimson Pro',serif}
.ft{display:flex;justify-content:space-between;font:600 .55em 'Cinzel',serif;gap:.4em}.rs{color:var(--c3);font-size:1.3em;line-height:.8}
.shine,.glare{position:absolute;inset:0;pointer-events:none}
.r-rare .front>.shine{background:linear-gradient(115deg,#0000 35%,#ffeaa6bb 47%,#fff 50%,#ffeaa6bb 53%,#0000 65%);background-size:260% 260%;background-position:var(--mx) var(--my);mix-blend-mode:soft-light}
.r-holo .art .shine{background:repeating-linear-gradient(115deg,#ff3d9a 0%,#ffd23d 5%,#3dffb0 10%,#3dc4ff 15%,#b03dff 20%,#ff3d9a 25%),repeating-linear-gradient(0deg,#fff3 0 1px,#0000 1px 3px);background-size:400% 400%,auto;background-position:var(--mx) var(--my),0 0;mix-blend-mode:color-dodge;opacity:.6}
.r-holo .front>.shine{background:repeating-linear-gradient(125deg,#ff3d9a33 0%,#3dc4ff33 8%,#3dffb033 16%,#ff3d9a33 24%);background-size:300% 300%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge}
.r-legend .front>.shine{background:radial-gradient(circle,#fff 0 .06em,#0000 .1em),radial-gradient(circle,#fff 0 .05em,#0000 .09em),repeating-linear-gradient(125deg,#ff3d9a 0%,#ffd23d 6%,#3dffb0 12%,#3dc4ff 18%,#b03dff 24%,#ff3d9a 30%);background-size:1.1em 1.1em,1.7em 1.7em,350% 350%;background-position:0 0,.5em .8em,var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:.42}
.r-legend .art .shine{background:radial-gradient(circle at var(--mx) var(--my),#ffe9a0aa,#0000 50%);mix-blend-mode:color-dodge}
.glare{background:radial-gradient(circle at var(--mx) var(--my),#fff9,#fff0 45%);mix-blend-mode:overlay}
.gift,.fiche{transform:rotateY(180deg)}
.gift{background:repeating-linear-gradient(45deg,#8e1820 0 1.4em,#a8222b 1.4em 2.8em);display:grid;place-items:center}
.gift::before,.gift::after{content:'';position:absolute;background:linear-gradient(90deg,#b8862a,#f4d68a,#b8862a)}
.gift::before{left:50%;top:0;bottom:0;width:2.4em;margin-left:-1.2em}
.gift::after{top:50%;left:0;right:0;height:2.4em;margin-top:-1.2em;background:linear-gradient(#b8862a,#f4d68a,#b8862a)}
.seal{position:relative;z-index:1;width:9em;height:9em;border-radius:50%;background:radial-gradient(#f9e4a6,#b8862a);color:#5a2c00;font:800 1.1em/1.15 'Cinzel',serif;display:grid;place-items:center;text-align:center;box-shadow:0 .3em .8em #0008}
.fiche{background:radial-gradient(ellipse at 50% 40%,#fbf1d8,#e9d3a4);color:var(--ink2);padding:1.1em 1.3em;display:flex;flex-direction:column;gap:.5em;border:.45em solid var(--c3)}
.fh{display:flex;justify-content:space-between;font:600 .75em 'Cinzel',serif}
.fiche h3{font:800 1.5em/1.1 'Cinzel',serif;margin:0}
.fart{height:27%;flex:none;border-radius:.4em;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--s1),var(--s2))}.fart svg{width:100%;height:100%}
.fiche p{margin:0;font-size:1.05em;line-height:1.3}
.clue{border:2px dashed #9e1b22;border-radius:.5em;padding:.45em .7em;background:#9e1b220f;font-size:1em;line-height:1.3}
.clue b{display:block;font:800 .72em 'Cinzel',serif;color:#9e1b22}
.fd{margin-top:auto;font-size:.75em;font-style:italic}
.card.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{scale:1.8;opacity:0}}
.card.pop{animation:pop 1.1s cubic-bezier(.3,1.2,.4,1)}
@keyframes pop{0%{scale:.1;rotate:-200deg;opacity:0}70%{scale:1.06;rotate:6deg;opacity:1}100%{scale:1;rotate:0deg}}

#ov{position:fixed;inset:0;z-index:60;background:#030812d9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;--ow:min(80vw,calc((100vh - 170px)*5/7))}
#ov.on{display:flex}
.ovc{position:relative;width:var(--ow);aspect-ratio:5/7}
.ovc .card{--cw:var(--ow);cursor:pointer}
.ovt{font:700 clamp(20px,3vw,34px)/1.1 'Cinzel Decorative',serif;color:var(--gold);margin:0;text-align:center}
.hint{font-style:italic;color:#f3dcaacc;margin:0;text-align:center;padding:0 16px;font-size:16px}
.rays{position:absolute;left:50%;top:50%;width:220%;aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(#e8c26a33 0 6deg,#0000 6deg 18deg);border-radius:50%;mask:radial-gradient(#000 20%,#0000 68%);animation:spin 18s linear infinite}
@keyframes spin{to{rotate:360deg}}
.sp{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff3c0;box-shadow:0 0 12px 4px #f4d68a;animation:fly 1.2s ease-out forwards}
@keyframes fly{from{transform:rotate(var(--a)) translateY(0)}to{transform:rotate(var(--a)) translateY(calc(-1*var(--d)));opacity:0}}

.ibook{position:absolute;left:50%;top:50%;width:min(72vw,calc(72vh*.72));aspect-ratio:.72;translate:-50% -50%;perspective:1800px;cursor:pointer}
.ipage{position:absolute;inset:2% 2% 2% 0;background:radial-gradient(ellipse,#fbf1d8,#e6cf9e);border-radius:0 10px 10px 0;display:grid;place-items:center;padding:14%;text-align:center;color:var(--ink2);font:italic clamp(17px,2.2vw,26px)/1.35 'Crimson Pro',serif}
.cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.6,.02,.25,1)}
.ibook.open .cover{transform:rotateY(-165deg)}
.cf,.cb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 14px 14px 4px}
.cf{background:linear-gradient(90deg,#0007,#0000 7%),radial-gradient(ellipse at 40% 30%,#b3262e,#6e0d13 70%,#3e060a);box-shadow:inset 0 0 0 12px #6e0d13,inset 0 0 0 14px var(--gold),inset 0 0 0 24px #6e0d13,inset 0 0 0 25px #e8c26a88,0 30px 60px #000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:14%;text-align:center}
.cb{transform:rotateY(180deg);background:#4a0a0f}
.cf svg{width:34%}
.ct{font:700 clamp(22px,4.4vw,48px)/1.08 'Cinzel Decorative',serif;color:var(--gold);text-shadow:0 2px 0 #5a3a08,0 0 18px #e8c26a55;text-wrap:balance}
.cs{font:600 clamp(13px,1.5vw,17px) 'Cinzel',serif;color:#f3dca0}
.tap{font-style:italic;color:#f3dca0cc;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

.bwrap{position:absolute;left:50%;top:calc(50% + 22px);translate:-50% -50%;padding:clamp(6px,1.2vw,16px);background:radial-gradient(ellipse,#8e1820,#4e080d);border-radius:14px;box-shadow:0 30px 70px #000c,inset 0 0 0 2px #e8c26a66}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(92vw,calc((100vh - 200px)*1.45));aspect-ratio:1.45;perspective:2400px;touch-action:pan-y}
.book.one{grid-template-columns:1fr;width:min(86vw,calc((100vh - 210px)*.725));aspect-ratio:.725}
.pg{height:100%;padding:5% 6%;color:var(--ink2);display:flex;flex-direction:column;gap:3%;overflow:hidden;background:linear-gradient(90deg,#f6ead0,var(--parch) 80%,#dcc394)}
.pg.r{background:linear-gradient(90deg,#dcc394,var(--parch) 20%,#f6ead0)}
.book.one .pg{background:linear-gradient(90deg,#dcc394,var(--parch) 10%,#f6ead0)}
.ph{display:flex;justify-content:space-between;font:600 clamp(11px,1.1vw,15px) 'Cinzel',serif;border-bottom:1px solid #3b241233;padding-bottom:2%}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:4%;align-items:center}
.slot{position:relative;width:100%;aspect-ratio:5/7;container-type:inline-size}
.slot .card{--cw:100cqw;cursor:pointer;touch-action:pan-y}
.slot.unk{border:2px dashed #3b241240;border-radius:6%/4.5%;background:#3b24120b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;font-family:'Cinzel',serif;color:#3b241288}
.q{font:800 34cqw/1 'Cinzel Decorative',serif;color:#3b241230}
.sil{width:86%;aspect-ratio:10/7;filter:brightness(0);opacity:.22}.sil svg{width:100%;height:100%}
.no{font-size:max(9px,10cqw)}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.3,1);z-index:5}
.leaf.right{left:50%;transform-origin:left center}.leaf.left{left:0;transform-origin:right center}
.leaf.full{left:0;width:100%;transform-origin:left center}.leaf.full.bwd{transform-origin:right center}
.leaf.right.go,.leaf.full.fwd.go{transform:rotateY(-180deg)}.leaf.left.go,.leaf.full.bwd.go{transform:rotateY(180deg)}
.lf,.lb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.lb{transform:rotateY(180deg)}
.bnav{position:fixed;left:50%;bottom:12px;translate:-50% 0;display:flex;align-items:center;gap:14px;z-index:41;font:600 14px 'Cinzel',serif;color:var(--gold)}
.bnav .btn{width:52px;font-size:22px;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body class="intro">
<header>
  <span class="brand">Grand Grimoire du Pôle Nord</span>
  <div class="seg" role="group" aria-label="Vue"><button data-v="table" aria-pressed="true">Table</button><button data-v="book" aria-pressed="false">Grimoire</button></div>
  <span class="count" id="count"></span><span class="net" id="net" hidden></span>
  <button class="btn gold" id="scan">Simuler un scan</button>
</header>
<svg class="garland" id="garland" aria-hidden="true"></svg>
<section class="view on" id="intro">
  <div class="ibook" id="ibook" role="button" tabindex="0" aria-label="Ouvrir le grimoire">
    <div class="ipage">Chaque indice trouvé réveille une merveille de Noël. Retrouvez-les toutes pour compléter le grimoire.</div>
    <div class="cover">
      <div class="cf">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#e8c26a" stroke-width="3" stroke-linecap="round" fill="none"><path d="M50 8v84M13.6 29l72.8 42M13.6 71l72.8-42"/><path d="M40 14l10 9 10-9M40 86l10-9 10 9M17 42l13-3-4-13M83 58l-13 3 4 13M17 58l13 3-4 13M83 42l-13-3 4-13"/></g><circle cx="50" cy="50" r="8" fill="#e8c26a"/></svg>
        <div class="ct">Grand Grimoire du Pôle Nord</div>
        <div class="cs">Encyclopédie des merveilles de Noël</div>
        <div class="tap">Touchez pour ouvrir</div>
      </div>
      <div class="cb"></div>
    </div>
  </div>
</section>
<section class="view" id="table"><p class="foot">Glissez les cartes · double-tap pour ouvrir</p></section>
<section class="view" id="bookv">
  <div class="bwrap"><div class="book" id="book"></div></div>
  <div class="bnav"><button class="btn" id="prev" aria-label="Page précédente">‹</button><span id="pl"></span><button class="btn" id="next" aria-label="Page suivante">›</button></div>
</section>
<p class="note">Démo : 3 cartes d'exemple, scan simulé.</p>
<div id="ov"></div>
<canvas id="snow"></canvas>
<script src="config.js"></script>
<script src="cartes.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const RMAP={rare:'rare',holo:'holo',legende:'legend',legend:'legend'};
const CARDS=(typeof CARTES!=='undefined'?CARTES:[]).map(c=>({n:c.n,code:String(c.code||''),name:c.nom,el:c.element||'givre',rar:RMAP[c.rarete]||'rare',pv:c.pv,type:c.type||'',atk:c.attaques||[],short:c.resume||'',lore:c.histoire||'',clue:c.indice||'',photo:c.photo||'',svg:c.dessin||''}));
const TOTAL=typeof TOTAL_CARTES!=='undefined'?TOTAL_CARTES:30,PER=6,PAGES=Math.ceil(TOTAL/PER);
const ICON={
givre:'<svg viewBox="0 0 24 24"><g stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5 12 6.5l2.5-2M9.5 19.5 12 17.5l2.5 2"/></g></svg>',
etoile:'<svg viewBox="0 0 24 24"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="#fff"/></svg>',
sapin:'<svg viewBox="0 0 24 24"><path d="M12 2l5 7h-3l4 6h-3l4 6H5l4-6H6l4-6H7z" fill="#fff"/></svg>',
braise:'<svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z" fill="#fff"/></svg>'};
const ELN={givre:'Givre',etoile:'Étoile',braise:'Braise',sapin:'Sapin'};
const RN={rare:'Rare',holo:'Holo',legend:'Légendaire'};
const RS={rare:'✦✦',holo:'✦✦✦',legend:'✦✦✦✦'};
const art=c=>c.photo?`<img src="${c.photo}" alt="" draggable="false">`:c.svg;
const START=(typeof DEMO_DEJA_TROUVEES!=='undefined'?DEMO_DEJA_TROUVEES:[]).filter(n=>CARDS.some(c=>c.n===n)).map(n=>[n,'12 déc. · 14:32']);
const DB=(typeof FIREBASE_URL!=='undefined'&&FIREBASE_URL)?String(FIREBASE_URL).trim().replace(/\/+$/,''):'';
let found=new Map(DB?[]:START);
const fmt=ts=>new Date(ts).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).replace(' à ',' · ');
const byCode=code=>CARDS.find(c=>c.code===code);
const byN=n=>CARDS.find(c=>c.n===n);
const pad=n=>String(n).padStart(3,'0');
const rand=(a,b)=>a+Math.random()*(b-a);
const mk=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

const front=c=>`<div class="face front"><div class="frame">
<div class="top"><span class="nm">${c.name}</span><span class="pv">PV <b>${c.pv}</b><span class="ico">${ICON[c.el]}</span></span></div>
<div class="art">${art(c)}<div class="shine"></div></div>
<div class="typ">${c.type}</div>
${c.atk.map(a=>`<div class="atk"><span class="ico sm">${ICON[c.el]}</span><div><b>${a[0]}</b><small>${a[1]}</small></div><span class="dmg">${a[2]}</span></div>`).join('')}
<div class="desc">${c.short}</div>
<div class="ft"><span>n°${pad(c.n)}/${TOTAL}</span><span class="rs">${RS[c.rar]}</span><span>${RN[c.rar]}</span></div>
</div><div class="shine"></div><div class="glare"></div></div>`;
const gift=()=>`<div class="face gift"><div class="seal">Grimoire<br>du Pôle<br>Nord</div></div>`;
const fiche=c=>`<div class="face fiche"><div class="fh"><span>n°${pad(c.n)}</span><span>${ELN[c.el]} · ${RN[c.rar]}</span></div><h3>${c.name}</h3><div class="fart">${art(c)}</div><p>${c.lore}</p><div class="clue"><b>Indice</b>${c.clue}</div><div class="fd">Découverte le ${found.get(c.n)||'—'}</div></div>`;
const cardHTML=(c,back)=>`<div class="card el-${c.el} r-${c.rar}" data-n="${c.n}"><div class="tilt"><div class="flipper">${front(c)}${back==='gift'?gift():back==='fiche'?fiche(c):''}</div></div></div>`;

const ST=new WeakMap();
const st=el=>{let s=ST.get(el);if(!s){s={mx:50,my:50,tx:50,ty:50,act:false,ph:Math.random()*6.28};ST.set(el,s)}return s};
function track(el){
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),s=st(el);s.act=true;s.tx=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));s.ty=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))});
  el.addEventListener('pointerleave',()=>{st(el).act=false});
  el.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')st(el).act=false});
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t){
  for(const el of document.querySelectorAll('.card')){
    const s=st(el);
    if(!s.act){s.tx=reduce?50:50+38*Math.sin(t*.0005+s.ph);s.ty=reduce?50:50+28*Math.cos(t*.00043+s.ph*1.7)}
    s.mx+=(s.tx-s.mx)*.12;s.my+=(s.ty-s.my)*.12;
    const k=s.act?16:5;
    el.style.setProperty('--mx',s.mx.toFixed(1)+'%');el.style.setProperty('--my',s.my.toFixed(1)+'%');
    el.style.setProperty('--ry',((s.mx-50)/50*k).toFixed(2)+'deg');el.style.setProperty('--rx',(-(s.my-50)/50*k).toFixed(2)+'deg');
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const table=$('#table'),pos=new Map();let zTop=10;
const cw=()=>Math.round(Math.max(130,Math.min(innerWidth*.21,(innerHeight-140)*.62*5/7)));
const place=(el,p)=>{el.style.transform=`translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`};
function clampPos(p){const w=cw(),h=w*1.4;p.x=Math.max(-w*.4,Math.min(innerWidth-w*.6,p.x));p.y=Math.max(60,Math.min(innerHeight-h*.5,p.y))}
function addToTable(n,drop){
  if(table.querySelector(`.card[data-n="${n}"]`))return;
  const el=mk(cardHTML(byN(n))),w=cw(),h=w*1.4,keys=[...found.keys()],i=keys.indexOf(n);
  if(!pos.has(n))pos.set(n,drop?{x:innerWidth/2-w/2,y:innerHeight/2-h/2+20,r:rand(-4,4)}:{x:innerWidth/2-w/2+(i-(keys.length-1)/2)*w*1.12+rand(-10,10),y:innerHeight/2-h/2+20+rand(-14,14),r:rand(-6,6)});
  const p=pos.get(n);clampPos(p);
  el.style.setProperty('--cw',w+'px');el.style.zIndex=++zTop;place(el,p);
  if(drop)el.classList.add('drop');
  table.appendChild(el);bindDrag(el,p,n);track(el);
}
function bindDrag(el,p,n){
  let d=null,last=0;
  el.addEventListener('pointerdown',e=>{if(d)return;el.setPointerCapture(e.pointerId);d={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:p.x,oy:p.y,m:false,h:[[e.clientX,e.clientY,performance.now()]]};p.vx=p.vy=0;el.style.zIndex=++zTop;el.classList.add('held')});
  el.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(!d.m&&Math.hypot(dx,dy)>8)d.m=true;if(d.m){p.x=d.ox+dx;p.y=d.oy+dy;place(el,p)}d.h.push([e.clientX,e.clientY,performance.now()]);if(d.h.length>5)d.h.shift()});
  const end=e=>{if(!d||e.pointerId!==d.id)return;el.classList.remove('held');
    if(!d.m){const t=performance.now();if(t-last<350){last=0;openDetail(n)}else last=t}
    else{const a=d.h[0],b=d.h[d.h.length-1],dt=Math.max(16,b[2]-a[2]);p.vx=(b[0]-a[0])/dt*16;p.vy=(b[1]-a[1])/dt*16;
      const step=()=>{if(el.classList.contains('held'))return;p.vx*=.92;p.vy*=.92;p.x+=p.vx;p.y+=p.vy;clampPos(p);place(el,p);if(Math.hypot(p.vx,p.vy)>.5)requestAnimationFrame(step)};step()}
    d=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function renderTable(){table.querySelectorAll('.card').forEach(c=>c.remove());for(const n of found.keys())addToTable(n,false)}

const ov=$('#ov');let ovLock=false,onClose=null;
function closeOv(){if(ovLock)return;ov.className='';ov.innerHTML='';const f=onClose;onClose=null;if(f)f();if(queue.length)setTimeout(()=>{if(queue.length&&!ov.className){const [n,ts]=queue.shift();queueReveal(n,ts)}},400)}
let queue=[];
function queueReveal(n,ts){if(found.has(n))return;if(ov.className){if(!queue.some(q=>q[0]===n))queue.push([n,ts]);return}reveal(n,ts)}
ov.addEventListener('click',closeOv);
function openDetail(n){
  const c=byN(n);
  ov.innerHTML=`<p class="ovt">${c.name}</p><div class="ovc"></div><p class="hint">Touchez la carte pour lire sa fiche · touchez à côté pour fermer</p>`;
  const el=mk(cardHTML(c,'fiche'));ov.querySelector('.ovc').appendChild(el);track(el);
  el.addEventListener('click',e=>{e.stopPropagation();el.classList.toggle('flip')});
  ov.className='on';
}
function reveal(n,ts){
  found.set(n,fmt(ts||Date.now()));
  updateUI();
  ov.innerHTML=`<p class="ovt">Nouvelle découverte</p><div class="ovc"><div class="rays"></div></div><p class="hint">&nbsp;</p>`;
  const box=ov.querySelector('.ovc'),el=mk(cardHTML(byN(n),'gift'));
  el.classList.add('flip','pop');box.appendChild(el);track(el);
  ov.className='on';ovLock=true;
  setTimeout(()=>el.classList.remove('flip'),1150);
  setTimeout(()=>{for(let i=0;i<30;i++){const s=document.createElement('span');s.className='sp';s.style.setProperty('--a',(i*12+rand(-5,5))+'deg');s.style.setProperty('--d',rand(160,340)+'px');box.appendChild(s)}},1500);
  setTimeout(()=>{ovLock=false;ov.querySelector('.hint').textContent='Touchez pour la poser sur la table'},2000);
  onClose=()=>{addToTable(n,true);if(view==='book')renderBook()};
}

const bk=$('#book');let page=0,busy=false,swiped=false;
const ppv=()=>innerWidth<720?1:2;
function slot(n){
  const c=byN(n);
  if(c&&found.has(n))return `<div class="slot found" data-n="${n}">${cardHTML(c)}</div>`;
  return `<div class="slot unk">${c?`<div class="sil${c.photo?' ph':''}">${art(c)}</div>`:'<span class="q">?</span>'}<span class="no">n°${pad(n)}</span></div>`;
}
function pageHTML(i){
  if(i<0||i>=PAGES)return '<div class="pg"></div>';
  let s='';for(let k=1;k<=PER;k++)s+=slot(i*PER+k);
  return `<div class="pg ${i%2?'r':'l'}"><div class="ph"><span>${i%2?'Merveilles de Noël':'Grand Grimoire'}</span><span>${i+1}</span></div><div class="grid">${s}</div></div>`;
}
function bindSlots(){bk.querySelectorAll('.slot.found').forEach(s=>{s.onclick=()=>{if(!swiped)openDetail(+s.dataset.n)};track(s.querySelector('.card'))})}
function renderBook(){
  const one=ppv()===1;if(!one&&page%2)page--;
  bk.classList.toggle('one',one);
  bk.innerHTML=pageHTML(page)+(one?'':pageHTML(page+1));bindSlots();
  $('#pl').textContent=one?`Page ${page+1} / ${PAGES}`:`Pages ${page+1}–${Math.min(page+2,PAGES)} / ${PAGES}`;
}
function turn(dir){
  if(busy)return;const one=ppv()===1,np=page+dir*(one?1:2);
  if(np<0||np>=PAGES)return;busy=true;let leaf;
  if(one){bk.innerHTML=pageHTML(np);leaf=`<div class="leaf full ${dir>0?'fwd':'bwd'}"><div class="lf">${pageHTML(page)}</div><div class="lb"><div class="pg"></div></div></div>`}
  else if(dir>0){bk.children[1].outerHTML=pageHTML(page+3);leaf=`<div class="leaf right"><div class="lf">${pageHTML(page+1)}</div><div class="lb">${pageHTML(page+2)}</div></div>`}
  else{bk.children[0].outerHTML=pageHTML(page-2);leaf=`<div class="leaf left"><div class="lf">${pageHTML(page)}</div><div class="lb">${pageHTML(page-1)}</div></div>`}
  const L=mk(leaf);bk.appendChild(L);
  requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.add('go')));
  setTimeout(()=>{page=np;busy=false;renderBook()},reduce?0:900);
}
$('#prev').onclick=()=>turn(-1);$('#next').onclick=()=>turn(1);
let sx=null;
bk.addEventListener('pointerdown',e=>{sx=e.clientX;swiped=false});
bk.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60){swiped=true;turn(dx<0?1:-1);setTimeout(()=>swiped=false,50)}});

let view='intro';
function setView(v){
  view=v;document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id===(v==='book'?'bookv':v)));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  if(v==='book')renderBook();
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
let armed=0;
function updateUI(){
  $('#count').textContent=`${found.size} / ${TOTAL} découvertes`;
  $('#scan').textContent=armed?'Confirmer la remise à zéro':found.size<CARDS.length?'Simuler un scan':DB?'Remettre à zéro':'Recommencer la démo';
}
function refresh(){updateUI();if(view==='table')renderTable();if(view==='book')renderBook()}
const pending=new Set();
function dbWrite(code,val,tries=0){
  if(!DB)return;
  if(val!==null)pending.add(code);
  fetch(`${DB}/trouvees/${encodeURIComponent(code)}.json`,val===null?{method:'DELETE'}:{method:'PUT',body:JSON.stringify(val)})
    .then(r=>{if(!r.ok)throw new Error(r.status);pending.delete(code)})
    .catch(()=>{if(tries<20)setTimeout(()=>dbWrite(code,val,tries+1),3000)});
}
function setNet(ok){const n=$('#net');n.hidden=false;n.className='net '+(ok?'ok':'ko');n.textContent=ok?'● en direct':'● hors ligne'}
function listen(){
  let ready=false;
  const es=new EventSource(`${DB}/trouvees.json`);
  const handle=(kind,e)=>{
    let m;try{m=JSON.parse(e.data)}catch(err){return}
    if(!m)return;
    const {path,data}=m;
    if(path==='/'&&kind==='put'){
      const all=data||{};
      for(const n of [...found.keys()]){const c=byN(n);if(!c||(!(c.code in all)&&!pending.has(c.code))){found.delete(n);pos.delete(n)}}
      for(const [code,ts] of Object.entries(all)){const c=byCode(code);if(c&&!found.has(c.n)){if(ready)queueReveal(c.n,ts);else found.set(c.n,fmt(ts))}}
      ready=true;refresh();return;
    }
    const entries=path==='/'?Object.entries(data||{}):[[path.slice(1).split('/')[0],data]];
    let changed=false;
    for(const [code,ts] of entries){const c=byCode(code);if(!c)continue;
      if(ts===null){if(found.has(c.n)){found.delete(c.n);pos.delete(c.n);changed=true}}
      else if(!found.has(c.n))queueReveal(c.n,ts);}
    if(changed)refresh();
  };
  es.addEventListener('put',e=>handle('put',e));
  es.addEventListener('patch',e=>handle('patch',e));
  es.onopen=()=>setNet(true);
  es.onerror=()=>setNet(false);
}
$('#scan').onclick=()=>{
  const miss=CARDS.find(c=>!found.has(c.n));
  if(miss&&!armed){reveal(miss.n);dbWrite(miss.code,Date.now());return}
  if(DB&&!armed){armed=setTimeout(()=>{armed=0;updateUI()},3000);updateUI();return}
  clearTimeout(armed);armed=0;
  if(DB){for(const n of found.keys())dbWrite(byN(n).code,null);found=new Map();pos.clear()}
  else{found=new Map(START);for(const k of [...pos.keys()])if(!found.has(k))pos.delete(k)}
  refresh();
};
const ib=$('#ibook');
const openBook=()=>{if(ib.classList.contains('open'))return;ib.classList.add('open');document.body.classList.remove('intro');setTimeout(()=>{setView('table');renderTable()},reduce?0:1700)};
ib.addEventListener('click',openBook);ib.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openBook()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeOv();if(view==='book'&&!ov.className){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)}});

const gar=$('#garland');
function drawGarland(){
  const W=innerWidth,cols=['#ff4d4d','#ffd34d','#4dff88','#4dc3ff','#ff4dd2'];let s=`<path d="M0 6 Q${W/4} 56 ${W/2} 10 T${W} 6" stroke="#1e3a26" stroke-width="2" fill="none"/>`;
  const N=Math.round(W/55);
  for(let i=1;i<N;i++){const t=i/N,x=W*t,u=t<.5?t*2:(t-.5)*2,y=(t<.5?(1-u)*(1-u)*6+2*(1-u)*u*56+u*u*10:(1-u)*(1-u)*10+2*(1-u)*u*(-36)+u*u*6)+6;
    const c=cols[i%cols.length];s+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="5" fill="${c}" style="filter:drop-shadow(0 0 6px ${c});animation-delay:${(i%7)*.33}s"/>`}
  gar.setAttribute('viewBox',`0 0 ${W} 70`);gar.innerHTML=s;
}
const cv=$('#snow'),cx=cv.getContext('2d');let flakes=[];
function sizeSnow(){cv.width=innerWidth;cv.height=innerHeight;const N=reduce?0:Math.round(innerWidth*innerHeight/9000);flakes=Array.from({length:N},()=>({x:rand(0,innerWidth),y:rand(0,innerHeight),r:rand(.8,2.8),v:rand(.3,1.1),p:rand(0,6.28)}))}
function snow(t){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='#ffffffcc';
  for(const f of flakes){f.y+=f.v;f.x+=Math.sin(t*.001+f.p)*.4;if(f.y>cv.height+4){f.y=-4;f.x=rand(0,cv.width)}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()}
  requestAnimationFrame(snow)}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{sizeSnow();drawGarland();if(view==='table')renderTable();if(view==='book')renderBook()},150)});
sizeSnow();drawGarland();requestAnimationFrame(snow);updateUI();
function fromHash(){
  const code=decodeURIComponent(location.hash.slice(1)).trim();if(!code)return;
  const c=CARDS.find(x=>x.code===code);if(!c)return;
  ib.classList.add('open');document.body.classList.remove('intro');
  if(view!=='book')setView('table');if(!table.querySelector('.card'))renderTable();
  closeOv();if(found.has(c.n))openDetail(c.n);else{reveal(c.n);dbWrite(c.code,Date.now())}
  history.replaceState(null,'',location.pathname+location.search);
}
fromHash();addEventListener('hashchange',fromHash);
if(DB)listen();
}
</script>
</body></html>
